<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M 80 0 H 0 V 80" fill="none" stroke="#364437" stroke-width="1" opacity="0.32"/></pattern></defs><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#111712" stroke="none" stroke-width="1" /><rect x="0" y="0" width="1920" height="1080" rx="0" fill="url(#grid)" stroke="none" stroke-width="1" opacity="0.24"/><rect x="0" y="0" width="10" height="1080" rx="0" fill="#C7EF79" stroke="none" stroke-width="1" /><circle cx="104" cy="54" r="19" fill="none" stroke="#C7EF79" stroke-width="3" /><circle cx="104" cy="54" r="6" fill="#C7EF79" stroke="none" stroke-width="1" /><text x="141" y="64" fill="#F3F4EC" font-size="31" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-0.8">ProofPatch</text><text x="1390" y="61" fill="#C7EF79" font-size="19" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.3">SYSTEM MAP / LIVE IMPLEMENTATION</text><line x1="88" y1="94" x2="1832" y2="94" stroke="#39483A" stroke-width="2" /><line x1="88" y1="1003" x2="1832" y2="1003" stroke="#39483A" stroke-width="2" /><text x="88" y="1041" fill="#7E8D7D" font-size="19" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >Fix and review use separate contexts of the same 120B model; neither can override failed checks.</text><text x="1768" y="1043" fill="#C7EF79" font-size="22" font-weight="600" font-family="Bahnschrift, Consolas, monospace" >01 / 05</text><text x="88" y="182" fill="#F3F4EC" font-size="74" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-3.5">One advisory. Three agents.</text><text x="88" y="261" fill="#F3F4EC" font-size="74" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-3.5">One reviewed PR.</text><rect x="88" y="304" width="82" height="6" rx="0" fill="#C7EF79" stroke="none" stroke-width="1" /><text x="88" y="362" fill="#A8B1A4" font-size="28" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >LangGraph routes the work. Groq runs the models. Tests decide whether a draft may open.</text><text x="88" y="414" fill="#C7EF79" font-size="19" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.3">LANGGRAPH ORCHESTRATOR: TYPED STATE, RETRY BUDGET, BLOCKED PATH</text><line x1="88" y1="429" x2="1832" y2="429" stroke="#39483A" stroke-width="2" /><line x1="385" y1="590" x2="396" y2="590" stroke="#596C58" stroke-width="3" /><path d="M 388 581 L 398 590 L 388 599" stroke="#596C58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="712" y1="590" x2="723" y2="590" stroke="#596C58" stroke-width="3" /><path d="M 715 581 L 725 590 L 715 599" stroke="#596C58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="1039" y1="590" x2="1050" y2="590" stroke="#596C58" stroke-width="3" /><path d="M 1042 581 L 1052 590 L 1042 599" stroke="#596C58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><line x1="1366" y1="590" x2="1377" y2="590" stroke="#596C58" stroke-width="3" /><path d="M 1369 581 L 1379 590 L 1369 599" stroke="#596C58" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="88" y="456" width="294" height="302" rx="12" fill="#19221A" stroke="#39483A" stroke-width="2" /><rect x="88" y="456" width="294" height="6" rx="0" fill="#87C9D4" stroke="none" stroke-width="1" /><text x="114" y="510" fill="#87C9D4" font-size="29" font-weight="700" font-family="Bahnschrift, Consolas, monospace" >00</text><text x="114" y="553" fill="#F3F4EC" font-size="21" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.3">SIGNAL + REPO</text><rect x="114" y="575" width="242" height="44" rx="7" fill="#1C271E" stroke="none" stroke-width="1" /><text x="130" y="605" fill="#87C9D4" font-size="23" font-weight="600" font-family="Bahnschrift, Consolas, monospace" >INPUT</text><text x="114" y="665" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >Public leads, OSV / vendor</text><text x="114" y="697" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >evidence and exact repo</text><text x="114" y="729" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >dependency inventory.</text><rect x="415" y="456" width="294" height="302" rx="12" fill="#19221A" stroke="#39483A" stroke-width="2" /><rect x="415" y="456" width="294" height="6" rx="0" fill="#C7EF79" stroke="none" stroke-width="1" /><text x="441" y="510" fill="#C7EF79" font-size="29" font-weight="700" font-family="Bahnschrift, Consolas, monospace" >01</text><text x="441" y="553" fill="#F3F4EC" font-size="21" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.3">SUPPLY CHAIN</text><rect x="441" y="575" width="242" height="44" rx="7" fill="#1C271E" stroke="none" stroke-width="1" /><text x="457" y="605" fill="#C7EF79" font-size="19" font-weight="600" font-family="Bahnschrift, Consolas, monospace" >openai/gpt-oss-20b</text><text x="441" y="665" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >Triages new leads.</text><text x="441" y="697" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >Checks whether a known</text><text x="441" y="729" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >version is actually installed.</text><rect x="742" y="456" width="294" height="302" rx="12" fill="#19221A" stroke="#39483A" stroke-width="2" /><rect x="742" y="456" width="294" height="6" rx="0" fill="#F5A37A" stroke="none" stroke-width="1" /><text x="768" y="510" fill="#F5A37A" font-size="29" font-weight="700" font-family="Bahnschrift, Consolas, monospace" >02</text><text x="768" y="553" fill="#F3F4EC" font-size="21" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.3">FIX AGENT</text><rect x="768" y="575" width="242" height="44" rx="7" fill="#1C271E" stroke="none" stroke-width="1" /><text x="784" y="605" fill="#F5A37A" font-size="19" font-weight="600" font-family="Bahnschrift, Consolas, monospace" >openai/gpt-oss-120b</text><text x="768" y="665" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >Proposes a scoped package</text><text x="768" y="697" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >or image update. Changes</text><text x="768" y="729" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >stay inside the allowed files.</text><rect x="1069" y="456" width="294" height="302" rx="12" fill="#19221A" stroke="#39483A" stroke-width="2" /><rect x="1069" y="456" width="294" height="6" rx="0" fill="#87C9D4" stroke="none" stroke-width="1" /><text x="1095" y="510" fill="#87C9D4" font-size="29" font-weight="700" font-family="Bahnschrift, Consolas, monospace" >GATE</text><text x="1095" y="553" fill="#F3F4EC" font-size="21" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.3">HARD EVIDENCE</text><rect x="1095" y="575" width="242" height="44" rx="7" fill="#1C271E" stroke="none" stroke-width="1" /><text x="1111" y="605" fill="#87C9D4" font-size="23" font-weight="600" font-family="Bahnschrift, Consolas, monospace" >GitHub Actions</text><text x="1095" y="665" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >Runs baseline and candidate</text><text x="1095" y="697" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >tests. Verifies advisory,</text><text x="1095" y="729" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >diff and exact commit.</text><rect x="1396" y="456" width="436" height="302" rx="12" fill="#19221A" stroke="#39483A" stroke-width="2" /><rect x="1396" y="456" width="436" height="6" rx="0" fill="#C8B6E9" stroke="none" stroke-width="1" /><text x="1422" y="510" fill="#C8B6E9" font-size="29" font-weight="700" font-family="Bahnschrift, Consolas, monospace" >03</text><text x="1422" y="553" fill="#F3F4EC" font-size="21" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.3">SENIOR REVIEW</text><rect x="1422" y="575" width="384" height="44" rx="7" fill="#1C271E" stroke="none" stroke-width="1" /><text x="1438" y="605" fill="#C8B6E9" font-size="19" font-weight="600" font-family="Bahnschrift, Consolas, monospace" >openai/gpt-oss-120b</text><text x="1422" y="665" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >Reads the real diff and CI.</text><text x="1422" y="697" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >Approves a draft or asks for</text><text x="1422" y="729" fill="#A8B1A4" font-size="24" font-weight="400" font-family="Segoe UI, Arial, sans-serif" >changes. Cannot waive gates.</text><path d="M 1190 766 V 800 H 890 V 780" stroke="#F5A37A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 9"/><path d="M 881 790 L 890 779 L 899 790" stroke="#F5A37A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="940" y="828" fill="#F5A37A" font-size="18" font-weight="500" font-family="Bahnschrift, Consolas, monospace" >Failed check: retry once or block</text><rect x="88" y="841" width="1744" height="115" rx="14" fill="#1C271E" stroke="#39483A" stroke-width="2" /><text x="117" y="879" fill="#C7EF79" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.3">AUTOMATED OUTPUT</text><text x="117" y="924" fill="#F3F4EC" font-size="43" font-weight="700" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-1.2">Verified draft PR</text><line x1="613" y1="902" x2="763" y2="902" stroke="#C7EF79" stroke-width="4" /><path d="M 755 893 L 765 902 L 755 911" stroke="#C7EF79" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="820" y="879" fill="#C7EF79" font-size="18" font-weight="600" font-family="Segoe UI, Arial, sans-serif" letter-spacing="2.3">FINAL AUTHORITY</text><text x="820" y="924" fill="#F3F4EC" font-size="39" font-weight="650" font-family="Segoe UI, Arial, sans-serif" letter-spacing="-1">Human review, merge and deployment</text></svg>